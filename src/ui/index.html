<!doctype html>
<html lang="pt-BR" data-theme-format="skew" data-modo="escuro">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://127.0.0.1:18984 http://127.0.0.1:18984; media-src 'self' blob: mediastream: gravacao:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'">
  <title>CCTV Express</title>
  <!-- as cores e a peça .sb-btn são as do tenant ebooks.express (Stream.Builders), da @ebx/temas -->
  <!-- a peça vem antes: o padrão neutro dela (cinzas) é sobrescrito pelas variáveis do tema -->
  <link rel="stylesheet" href="tema/sb-btn.css">
  <link rel="stylesheet" href="tema/tema.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><img src="marca/emblema.svg" alt="" width="36" height="35"><span><b>cctv</b>.express</span></div>
    <nav class="mosaicos" id="mosaicos" aria-label="Mosaico"></nav>
    <button class="sb-btn sb-btn--sm" id="abrir-reproducao"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="topo.reproducao"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
    <button class="sb-btn sb-btn--sm" id="abrir-config"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="topo.configuracoes"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
  </header>

  <main class="area">
    <section class="mosaico" id="mosaico" aria-label="Câmeras ao vivo"></section>
    <aside class="lateral">
      <div class="resumo" id="resumo" aria-live="polite"></div>
      <div class="lateral__cabeca">
        <h2 data-t="lateral.cameras"></h2>
        <button class="sb-btn sb-btn--sm" id="adicionar"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="lateral.adicionar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </div>
      <div class="lateral__acao">
        <button class="sb-btn sb-btn--sm sb-btn--block" id="detectar"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="lateral.detectar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </div>
      <ul class="lista" id="lista"></ul>
    </aside>
  </main>

  <dialog id="dialogo">
    <form method="dialog" id="formulario">
      <h2 id="formulario-titulo"></h2>
      <input type="hidden" name="id">
      <label><span data-t="form.nome"></span> <input name="nome" data-t-placeholder="form.nomeExemplo" autocomplete="off"></label>
      <label><span data-t="form.tipo"></span>
        <select name="tipo">
          <option value="xiongmai" data-t="form.tipoXiongmai"></option>
          <option value="onvif" data-t="form.tipoOnvif"></option>
          <option value="rtsp" data-t="form.tipoRtsp"></option>
        </select>
      </label>
      <div class="linha">
        <label><span data-t="form.ip"></span> <input name="ip" placeholder="192.168.18.11" required autocomplete="off"></label>
        <label><span data-t="form.porta"></span> <input name="porta" type="number" min="1" max="65535" data-t-placeholder="form.portaPadrao"></label>
        <label><span data-t="form.canal"></span> <input name="canal" type="number" min="1" max="64" value="1"></label>
      </div>
      <label class="so-rtsp"><span data-t="form.url"></span> <input name="url" placeholder="rtsp://192.168.18.114:8554/live" autocomplete="off"></label>
      <div class="linha">
        <label><span data-t="form.usuario"></span> <input name="usuario" value="admin" autocomplete="off"></label>
        <label><span data-t="form.senha"></span> <span class="campo-senha"><input name="senha" type="password" autocomplete="new-password"><button type="button" class="sb-btn sb-btn--sm sb-btn--square" id="ver-senha"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="sb-btn__gloss" aria-hidden="true"></span></button></span></label>
      </div>
      <label class="marcar"><input type="checkbox" name="gravar" checked> <span data-t="form.gravar"></span></label>
      <p class="aviso" id="formulario-aviso"></p>
      <menu>
        <button type="button" class="sb-btn sb-btn--sm sb-btn--danger" id="remover" hidden><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="form.remover"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <span class="espaco"></span>
        <button type="button" class="sb-btn sb-btn--sm" data-fechar><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="form.cancelar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <button type="submit" class="sb-btn sb-btn--sm sb-btn--ativo" value="salvar"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="form.salvar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </menu>
    </form>
  </dialog>

  <dialog id="dialogo-config">
    <form method="dialog" id="form-config">
      <h2 data-t="config.titulo"></h2>
      <label><span data-t="config.idioma"></span> <select name="idioma" id="idioma"></select></label>
      <h3 data-t="config.gravacao"></h3>
      <label><span data-t="config.pasta"></span>
        <span class="pasta">
          <input name="pastaGravacoes" required>
          <button type="button" class="sb-btn sb-btn--sm" id="escolher-pasta"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="config.escolher"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
          <button type="button" class="sb-btn sb-btn--sm" id="abrir-pasta"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="config.abrirPasta"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        </span>
      </label>
      <div class="linha linha--3">
        <label><span data-t="config.minutos"></span> <input name="minutosPorBloco" type="number" min="1" max="1440" required></label>
        <label><span data-t="config.dias"></span> <input name="diasRetencao" type="number" min="1" max="3650" required></label>
        <label><span data-t="config.espaco"></span> <input name="espacoMinimoGB" type="number" min="1" max="10000" required></label>
      </div>
      <p class="ajuda" data-t="config.retencaoAjuda"></p>
      <h3 data-t="config.deteccao"></h3>
      <label class="marcar"><input type="checkbox" name="deteccao"> <span data-t="config.deteccaoLigada"></span></label>
      <label><span data-t="config.sensibilidade"></span> <input name="sensibilidade" type="range" min="1" max="10" step="1"></label>
      <label class="marcar"><input type="checkbox" name="notificar"> <span data-t="config.notificar"></span></label>
      <menu>
        <span class="espaco"></span>
        <button type="button" class="sb-btn sb-btn--sm" data-fechar><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="form.cancelar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <button type="submit" class="sb-btn sb-btn--sm sb-btn--ativo"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="form.salvar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </menu>
    </form>
  </dialog>

  <dialog id="dialogo-detectar">
    <div class="painel">
      <h2 data-t="detectar.titulo"></h2>
      <p class="ajuda" id="detectar-estado"></p>
      <ul class="lista lista--detectar" id="detectar-lista"></ul>
      <menu>
        <button type="button" class="sb-btn sb-btn--sm" id="detectar-de-novo"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="detectar.procurarDeNovo"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <span class="espaco"></span>
        <button type="button" class="sb-btn sb-btn--sm" data-fechar><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="config.fechar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </menu>
    </div>
  </dialog>

  <dialog id="dialogo-reproducao" class="dialogo-grande">
    <div class="painel reproducao">
      <div class="reproducao__topo">
        <h2 data-t="reproducao.titulo"></h2>
        <select id="rep-camera"></select>
        <input type="date" id="rep-dia">
        <span class="espaco"></span>
        <button type="button" class="sb-btn sb-btn--sm" data-fechar><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="config.fechar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </div>
      <div class="reproducao__video"><video id="rep-video" controls></video><p class="ajuda" id="rep-vazio"></p></div>
      <div class="linha-tempo" id="rep-linha"><div class="linha-tempo__horas" id="rep-horas"></div><div class="linha-tempo__faixa" id="rep-faixa"></div></div>
      <div class="reproducao__acoes">
        <span class="hora" id="rep-hora">--:--:--</span>
        <button type="button" class="sb-btn sb-btn--sm" id="rep-marcar-inicio"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4v16M10 12h10"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="reproducao.marcarInicio"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <button type="button" class="sb-btn sb-btn--sm" id="rep-marcar-fim"><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 4v16M4 12h10"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="reproducao.marcarFim"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
        <span class="ajuda" id="rep-trecho"></span>
        <span class="espaco"></span>
        <button type="button" class="sb-btn sb-btn--sm sb-btn--ativo" id="rep-exportar" disabled><span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span><span class="sb-btn__body"><span class="sb-btn__label" data-t="reproducao.exportar"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span></button>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
