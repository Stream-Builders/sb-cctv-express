// O CCTV Express no celular: transforma o celular numa câmera IP (o vídeo sai por RTSP na rede local, servidor RTSP do
// RootEncoder, Apache 2.0) e assiste as câmeras da rede (RTSP e DVRIP da Xiongmai, decodificados pelo MediaCodec do
// próprio aparelho), como o app do computador.
plugins { id 'com.android.application' }

android {
  namespace = 'builders.stream.cctvexpress.camera'
  compileSdk = 37
  defaultConfig {
    applicationId = 'builders.stream.cctvexpress.camera'
    minSdk = 24
    targetSdk = 37
    versionCode = 12
    versionName = '0.5.0'
  }
  buildTypes {
    release {
      minifyEnabled = false
      // assinatura de teste até a chave de publicação ir para o cofre
      signingConfig = signingConfigs.debug
    }
  }
  compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'com.github.pedroSG94:RTSP-Server:1.4.3'
  implementation 'com.github.pedroSG94.RootEncoder:library:2.8.2'
  // serve os assets por https local (módulos JS e fetch do letreiro 3D não abrem por file://)
  implementation 'androidx.webkit:webkit:1.18.0'
}

// a peça .sb-btn e o tema vêm do CCTV Express do computador (src/ui/tema): a mesma fonte, nunca uma cópia à mão
tasks.register('copiarTema', Copy) {
  from("$rootDir/../src/ui/tema") { include 'sb-btn.css', 'tema.css' }
  into("$projectDir/src/main/assets/tema")
}
// a abertura: o mesmo letreiro 3D do CCTV Express do computador (src/splash) e a logo dele
tasks.register('copiarAbertura', Copy) {
  from("$rootDir/../src/splash") { into 'splash' }
  from("$rootDir/../src/ui/marca") { include 'logo.svg'; into 'ui/marca' }
  into("$projectDir/src/main/assets")
}
// os textos da tela de assistir: os mesmos 18 idiomas do app do computador (src/ui/i18n)
tasks.register('copiarTextos', Copy) {
  from("$rootDir/../src/ui/i18n") { into 'i18n' }
  into("$projectDir/src/main/assets")
}
preBuild.dependsOn copiarTema, copiarAbertura, copiarTextos
