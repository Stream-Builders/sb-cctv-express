<!doctype html>
<!-- Assistir as câmeras da rede, como no CCTV Express do computador. Esta tela fica por cima do vídeo: os quadros do
     mosaico são transparentes e o app (Kotlin) põe o player nativo de cada câmera exatamente embaixo de cada quadro.
     Os botões são a peça .sb-btn do computador (sb-btn.css e tema.css copiados no build) e os textos os mesmos 18
     idiomas dele (i18n/). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="tema/sb-btn.css">
<link rel="stylesheet" href="tema/tema.css">
<link rel="stylesheet" href="assistir.css">
</head>
<body>
<header class="topo">
  <span class="marca">cctv<b>.express</b></span>
  <span class="resumo" id="resumo" aria-live="polite"></span>
  <nav class="acoes" id="acoes"></nav>
</header>
<main class="mosaico" id="mosaico" aria-live="off"></main>
<div class="paginas" id="paginas" hidden></div>
<div class="vazio" id="vazio" hidden><p id="vazio-texto"></p><div id="vazio-acoes"></div></div>

<div class="caixa" id="caixa-form" hidden>
  <form id="form" autocomplete="off">
    <h2 id="form-titulo"></h2>
    <input type="hidden" name="id">
    <label><span data-t="form.nome"></span><input name="nome" data-t-placeholder="form.nomeExemplo"></label>
    <label><span data-t="form.tipo"></span>
      <select name="tipo">
        <option value="xiongmai" data-t="form.tipoXiongmai"></option>
        <option value="onvif" data-t="form.tipoOnvif"></option>
        <option value="rtsp" data-t="form.tipoRtsp"></option>
      </select>
    </label>
    <p class="nota" id="nota-xiongmai"></p>
    <div class="linha">
      <label class="largo"><span data-t="form.ip"></span><input name="ip" inputmode="decimal" placeholder="192.168.0.10"></label>
      <label><span data-t="form.porta"></span><input name="porta" type="number" min="1" max="65535" inputmode="numeric" data-t-placeholder="form.portaPadrao"></label>
      <label><span data-t="form.canal"></span><input name="canal" type="number" min="1" max="64" value="1" inputmode="numeric"></label>
    </div>
    <label class="so-rtsp"><span data-t="form.url"></span><input name="url" inputmode="url" placeholder="rtsp://192.168.0.10:554/stream1" autocapitalize="off" spellcheck="false"></label>
    <div class="linha">
      <label><span data-t="form.usuario"></span><input name="usuario" value="admin" autocapitalize="off" spellcheck="false"></label>
      <label><span data-t="form.senha"></span><span class="campo" id="campo-senha"><input name="senha" type="password" autocapitalize="off" spellcheck="false"></span></label>
    </div>
    <p class="aviso" id="form-aviso" aria-live="polite"></p>
    <div class="botoes" id="form-botoes"></div>
  </form>
</div>

<div class="caixa" id="caixa-detectar" hidden>
  <div class="painel">
    <h2 data-t="detectar.titulo"></h2>
    <p class="nota" id="detectar-estado"></p>
    <ul class="lista" id="detectar-lista"></ul>
    <div class="botoes" id="detectar-botoes"></div>
  </div>
</div>

<div class="caixa" id="caixa-lista" hidden>
  <div class="painel">
    <h2 data-t="lateral.cameras"></h2>
    <ul class="lista" id="lista"></ul>
    <div class="botoes" id="lista-botoes"></div>
  </div>
</div>

<div class="caixa" id="caixa-arquivo" hidden>
  <form class="painel" id="form-arquivo">
    <h2 data-t="arquivo.titulo"></h2>
    <p class="nota" data-t="arquivo.senhaAjuda"></p>
    <label><span data-t="arquivo.senha"></span><span class="campo" id="campo-arquivo"><input id="arquivo-senha" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></span></label>
    <p class="aviso" id="arquivo-aviso" aria-live="polite"></p>
    <div class="botoes" id="arquivo-botoes"></div>
  </form>
</div>

<script type="module" src="assistir.js"></script>
</body>
</html>
