<!doctype html>
<!-- O início do app: a abertura com o letreiro 3D do CCTV Express e a escolha do modo (usar o celular como câmera ou
     assistir as câmeras da rede). A abertura roda sozinha, antes de a câmera do celular ligar: o letreiro não disputa
     a GPU com a câmera (era o que deixava a tela preta). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<link rel="stylesheet" href="tema/sb-btn.css">
<link rel="stylesheet" href="tema/tema.css">
<style>
  html, body { margin: 0; height: 100%; background: #07080a; color: #EFE6D0; font-family: system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  .abertura { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #16191f 0%, #07080a 75%); transition: opacity .6s ease; }
  .abertura canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* a logo plana fica à vista até o 3D desenhar o primeiro quadro: a abertura nunca é só uma tela preta */
  .abertura .plana { width: min(70vw, 70vh * 1.42); transition: opacity .35s ease; }
  .abertura.com-3d .plana { opacity: 0; }
  .abertura.saindo { opacity: 0; pointer-events: none; }
  .escolha { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; background: radial-gradient(ellipse at 50% 30%, #16191f 0%, #07080a 75%); }
  .escolha img { width: min(46vw, 220px); }
  .escolha h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; text-align: center; }
  .modos { display: grid; gap: 14px; width: min(100%, 460px); }
  @media (orientation: landscape) and (min-width: 600px) { .modos { grid-template-columns: 1fr 1fr; width: min(100%, 820px); } }
  .modo { display: grid; gap: 8px; padding: 14px; background: #101011; border: 1px solid #2a2f38; }
  .modo p { margin: 0; font-size: 13px; line-height: 1.4; color: #8d887c; }
  .sb-btn { --sb-h: 3rem; width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="abertura" id="abertura">
  <img class="plana" src="ui/marca/logo.svg" alt="cctv.express">
  <canvas id="letreiro" aria-hidden="true"></canvas>
</div>
<div class="escolha" id="escolha" hidden>
  <img src="ui/marca/logo.svg" alt="cctv.express">
  <h1 id="titulo"></h1>
  <div class="modos">
    <div class="modo"><div id="m-camera"></div><p id="p-camera"></p></div>
    <div class="modo"><div id="m-assistir"></div><p id="p-assistir"></p></div>
  </div>
</div>
<script>
  // trava de segurança (script comum, roda mesmo se o módulo do letreiro falhar ou nunca terminar): a abertura sai no
  // máximo em 9 s, e um toque pula na hora
  (() => {
    const ab = document.getElementById('abertura');
    const fechar = () => {
      if (!ab.isConnected || ab.classList.contains('saindo')) return;
      ab.classList.add('saindo');
      setTimeout(() => { ab.remove(); Inicio.aberturaTerminou(); }, 650);
    };
    window.fecharAbertura = fechar;
    setTimeout(fechar, 9000);
    ab.addEventListener('click', fechar);
    // vindo do botão Início de um modo: sem abertura
    if (Inicio.pularAbertura()) { ab.remove(); Inicio.aberturaTerminou(); }
  })();
</script>
<script type="module">
  import { carregar, maisProximo, t } from './i18n/i18n.js';
  import { textosDoCelular } from './textos.js';

  const ICONES = {
    camera: '<path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/>',
    assistir: '<rect x="3" y="4" width="8" height="7"/><rect x="13" y="4" width="8" height="7"/><rect x="3" y="13" width="8" height="7"/><rect x="13" y="13" width="8" height="7"/>',
  };
  function botao(icone, rotulo, ativo, aoClicar) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sb-btn' + (ativo ? ' sb-btn--ativo' : '');
    b.innerHTML = '<span class="sb-btn__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icone + '</svg></span><span class="sb-btn__body"><span class="sb-btn__label"></span></span><span class="sb-btn__gloss" aria-hidden="true"></span>';
    b.querySelector('.sb-btn__label').textContent = rotulo;
    b.addEventListener('click', aoClicar);
    return b;
  }

  const idioma = maisProximo(navigator.language);
  await carregar(idioma).catch(() => {});
  const C = textosDoCelular(idioma);
  const ultimo = Inicio.ultimoModo();
  document.getElementById('titulo').textContent = C.modoTitulo;
  document.getElementById('m-camera').append(botao(ICONES.camera, C.modoCamera, ultimo === 'camera', () => Inicio.escolher('camera')));
  document.getElementById('m-assistir').append(botao(ICONES.assistir, C.modoAssistir, ultimo === 'assistir', () => Inicio.escolher('assistir')));
  document.getElementById('p-camera').textContent = C.modoCameraAjuda;
  document.getElementById('p-assistir').textContent = C.modoAssistirAjuda;
  // chamado pelo app quando a escolha deve aparecer (primeira vez ou vindo do botão Início)
  window.mostrarEscolha = () => { document.getElementById('escolha').hidden = false; };
  if (window.escolhaPendente) window.mostrarEscolha();

  const ab = document.getElementById('abertura');
  if (ab.isConnected) {
    const canvas = document.getElementById('letreiro');
    try {
      const { montar } = await import('./splash/letreiro.js');
      await montar(canvas, 'ui/marca/logo.svg');
      // o primeiro quadro já foi desenhado dois quadros depois da montagem: troca a logo plana pelo 3D e conta o
      // tempo do letreiro acender antes de sair
      requestAnimationFrame(() => requestAnimationFrame(() => {
        ab.classList.add('com-3d');
        setTimeout(() => window.fecharAbertura(), 5600);
      }));
    } catch {
      // sem WebGL: fica a logo plana por um instante
      canvas.remove();
      setTimeout(() => window.fecharAbertura(), 1800);
    }
  }
</script>
</body>
</html>
