<!doctype html>
<!-- CARTAO DA SECAO BRANDING (sb-land e tk-port): o letreiro 3D do CCTV Express (o mesmo do splash do app e de
     cctvexpress.stream.builders, three.js) em laço: a câmera entra girando e acende, o nome acende em neon, fica aceso,
     apaga piscando e recomeça. Por trás, o fundo em canvas: uma parede de câmeras com REC, caixas de detecção de
     movimento e a linha de varredura. A fonte é o repo sb-cctv-express (cartao/); copiado para public/branding dos
     dois sites por `node scripts/empacotar-cartao.mjs`. NAO editar as cópias. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV Express &mdash; Letreiro 3D (three.js / WebGL)</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#07080a;overflow:hidden}
  #fundo,#letreiro{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fundo{z-index:0}
  #letreiro{z-index:1;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<canvas id="fundo" aria-hidden="true"></canvas>
<canvas id="letreiro" aria-label="cctv.express"></canvas>
<script src="./cartao-comum.js?v=6"></script>
<script type="module">
  import { fundoDeCameras } from './cctv-express/fundo.js?v=1';
  import { montar } from './cctv-express/letreiro.js?v=1';
  fundoDeCameras(document.getElementById('fundo'));
  montar(document.getElementById('letreiro'), './cctv-express/logo.svg?v=1', { ciclo: 11 });
</script>
</body>
</html>
